project: yandex_taxi_corp
display_name: "Яндекс Такси (корпоративный) — отдел продаж"
success_definition: "Регистрация / онлайн-оферта / пополнение баланса"

# --- Соответствие скрипту (раздел 6.1). Скелет, а не жёсткая рамка. ---
checklist:
  - id: introduced
    label: "Представился и назвал компанию"
  - id: greeted
    label: "Поздоровался"
  - id: empathy
    label: "Эмпатия / фразы присоединения"
    measure: percent            # дополнительно просим у LLM оценку 0-100
  - id: handled_objections
    label: "Отработал возражения"
  - id: handled_price_objection
    label: "Отработал возражение по цене"
    critical: true              # ключевая зона потерь
  - id: proposed_next_step
    label: "Предложил следующий шаг / закрытие / апсейл"

# --- Ред-флаги (раздел 6.2). Добавляются БЕЗ правки кода. ---
# patterns — сильные подсказки для LLM; модель также применяет смысловое суждение
# (формулировки «до/от» бывают разными), поэтому это не тупой regex-матч.
redflag_rules:
  - id: forbidden_taxi_eta
    type: compliance_token
    who: operator
    severity: high
    description: "Обещание подачи «до X минут» вместо «от X минут» — заказчик (Яндекс) НЕ засчитывает лид"
    patterns: ["до 5 минут", "подача до", "приедет за 5 минут", "максимум 5 минут"]
  - id: false_cheaper_claim
    type: grey_wording
    who: operator
    severity: medium
    description: "Ложное «у нас дешевле, чем для физлиц»"
    patterns: ["дешевле чем для физлиц", "дешевле для вас", "вам выгоднее чем физикам"]
  - id: profanity
    type: profanity
    who: any
    severity: medium
    description: "Нецензурная брань / мат"
  - id: threats_legal
    type: threats
    who: any
    severity: high
    description: "Угрозы, упоминание суда, мошенников"

# --- Категории результата контакта (раздел 6.3) ---
# ВАЖНО: description ниже уходит прямо в промпт LLM (build_prompts в src/analyzer.py) —
# это не комментарий для человека. Без описаний модель систематически путает reached/not_reached
# (судит по исходу «продали или нет», а не по факту «был ли содержательный разговор»), из-за
# чего реальные провалы оператора маскируются под BASE_FAULT в отчёте денег. Проверено на живых
# звонках 10.08-12.08.2026: 8 из 10 ушли в not_reached, хотя минимум в 4-5 клиент отвечал и разговор
# состоялся — оператор просто не отработал возражение/не предложил следующий шаг.
result_categories:
  - id: reached
    description: >-
      Клиент ответил, и состоялся содержательный разговор — независимо от исхода (отказ, перенос,
      согласие). Используй ЭТУ категорию для любого реального диалога, если он не подпадает под более
      специфичную категорию ниже (individual_not_legal/wrong_number/aggressive/not_relevant/already_driving/success).
  - id: not_reached
    description: >-
      Разговора НЕ было: не взяли трубку, гудки, автоответчик, сразу сброс без единой реплики клиента.
      НЕ используй эту категорию, если клиент отвечал репликами и диалог шёл — даже короткий и
      неудачный для оператора разговор это reached (или более специфичная категория), а не not_reached.
  - id: call_dropped
    description: "Разговор начался, но оборвался технически / по связи — не по решению клиента."
  - id: individual_not_legal
    description: "Дозвонились и поговорили, но это физлицо, а не юрлицо/ИП — не целевой лид."
  - id: wrong_number
    description: "Номер оказался не тем человеком/компанией, которую искали."
  - id: aggressive
    description: "Клиент вёл себя агрессивно, грубо или неадекватно."
  - id: not_relevant
    description: "Содержательный разговор состоялся, клиент явно отказался или сказал «не актуально»."
  - id: already_driving
    description: "Клиент сам таксует / уже водитель — сервис ему нужен не как клиенту."
  - id: success
    description: "Целевое действие достигнуто: регистрация, принятие оферты, пополнение баланса."
  - id: no_data
    description: >-
      ТЕХНИЧЕСКАЯ категория — ставит её только код (src/analyzer.py::_no_data_analysis), когда STT
      не вернул ни одной реплики. LLM эту категорию не выбирает и её не видит в задаче.

# --- Пороги для детерминированных метрик ---
metrics:
  pause_without_hold_threshold_sec: 3.0
  short_call_suspicious_sec: 45
  # Проверено на живых звонках 10-12.08.2026: 7 из 8 звонков, ушедших в no_data (STT не
  # нашёл речи), реально длились 1.2-2.9с по факту записи — говорить там физически нечего.
  # Раньше пайплайн всё равно тратился на скачивание+STT прежде чем это понять. Отсекаем
  # такие звонки до платных вызовов, тем же путём что и duration<=0 (economy, см. Pipeline.
  # _process_row) — 3с выбрано с запасом (даже "алло — до свидания" короче не бывает).
  min_billable_duration_sec: 3.0

# --- Экономика для отчёта «где деньги» / what-if (раздел 7) ---
# 0 = экономика ЕЩЁ НЕ НАСТРОЕНА. Пока avg_deal_value=0, отчёт считает все операционные
# метрики (звонки/конверсия/потери/ред-флаги/этапы) как обычно, но денежные суммы не
# показывает как "0" (это было бы враньём — потери есть, просто не оценены в деньгах),
# а помечает явно как "н/д" (см. build_money_report/economics_configured в report_money.py).
# Как только появятся реальные цифры — просто впишите их сюда, код ничего чинить не надо:
# avg_deal_value — средняя выручка с закрытой сделки (тенге);
# recovery_rate  — доля «спасаемых» потерь, которые при правильной отработке закрылись бы (0..1).
economics:
  currency: KZT
  avg_deal_value: 0
  recovery_rate: 0
