<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Call Analyzer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script>
    (function(){
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    /* ── Токены: светлая по умолчанию, тёмная — явным атрибутом (переключатель в шапке). ── */
    /* ── Значения — из валидированной палитры dataviz: статусы фиксированы в обоих режимах, ── */
    /* ── категориальные оттенки степенятся отдельно под тёмную поверхность. ── */
    :root{
      --bg:#f9f9f7; --bg2:#f2f1ec;
      --card:#fcfcfb; --card2:#f1f0ea;
      --line:#e5e3db; --line2:rgba(11,11,11,.12);
      --txt:#0b0b0b; --mut:#52514e; --dim:#898781;
      --accent:#2a78d6; --accent-soft:rgba(42,120,214,.10);
      --money:#eda100; --money-text:#8a5b00; --money-soft:rgba(196,133,0,.14);
      --good:#0ca30c; --good-text:#006300; --good-soft:rgba(12,163,12,.10);
      --bad:#d03b3b; --bad-text:#b3271f; --bad-soft:rgba(208,59,59,.10);
      --warn:#fab219; --warn-text:#8a5c00; --warn-soft:rgba(250,178,25,.16);
      --radius:14px; --shadow:0 1px 0 rgba(255,255,255,.6), 0 8px 20px -14px rgba(11,11,11,.25);
      --mono:'JetBrains Mono',ui-monospace,"SF Mono",Menlo,Consolas,monospace;
      --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color-scheme: light;
    }
    :root[data-theme="dark"]{
      --bg:#16171c; --bg2:#1b1d23;
      --card:#212328; --card2:#282b32;
      --line:#34373f; --line2:rgba(255,255,255,.14);
      --txt:#f5f5f3; --mut:#c3c2b7; --dim:#8b8d95;
      --accent:#3987e5; --accent-soft:rgba(57,135,229,.16);
      --money:#e0a52e; --money-text:#e0a52e; --money-soft:rgba(224,165,46,.16);
      --good:#0ca30c; --good-text:#2fc72f; --good-soft:rgba(12,163,12,.16);
      --bad:#d03b3b; --bad-text:#ea6c6c; --bad-soft:rgba(208,59,59,.18);
      --warn:#fab219; --warn-text:#fab219; --warn-soft:rgba(250,178,25,.16);
      --shadow:0 1px 0 rgba(255,255,255,.03), 0 10px 26px -14px rgba(0,0,0,.65);
      color-scheme: dark;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:
        radial-gradient(1200px 600px at 85% -10%, var(--money-soft) 0%, transparent 55%),
        var(--bg);
      color:var(--txt);
      font:15px/1.55 var(--sans);
      -webkit-font-smoothing:antialiased;
      transition:background .2s,color .2s}
    /* ── Пара цветных пятен на тёмном фоне — то, что реально размывает backdrop-filter ── */
    :root[data-theme="dark"] body{background:
        radial-gradient(1100px 560px at 88% -8%, var(--money-soft) 0%, transparent 55%),
        radial-gradient(900px 520px at 6% 18%, var(--accent-soft) 0%, transparent 52%),
        radial-gradient(800px 480px at 30% 95%, var(--good-soft) 0%, transparent 50%),
        var(--bg);
      background-attachment:fixed}
    a{color:var(--accent);text-decoration:none;transition:color .15s}
    a:hover{color:var(--accent);filter:brightness(1.2)}
    ::selection{background:var(--accent-soft)}
    svg.ico{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;
      stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}

    /* ── Шапка ── */
    nav{display:flex;align-items:center;gap:4px;padding:12px 22px;
      border-bottom:1px solid var(--line);
      background:color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter:saturate(160%) blur(10px);
      position:sticky;top:0;z-index:20;flex-wrap:wrap}
    nav .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.01em;
      margin-right:18px;color:var(--txt)}
    nav .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--money);
      box-shadow:0 0 0 4px var(--money-soft)}
    nav .brand small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.16em;
      color:var(--mut);text-transform:uppercase;margin-top:-2px}
    nav .section-label{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
      color:var(--dim);margin-right:8px}
    nav a.nl{display:inline-flex;align-items:center;gap:7px;color:var(--mut);font-weight:600;font-size:14px;
      padding:7px 12px;border-radius:9px;transition:background .15s,color .15s}
    nav a.nl:hover{color:var(--txt);background:var(--card2);filter:none}
    nav a.nl.active{color:var(--txt);background:var(--card2)}
    nav a.nl.active svg{stroke:var(--accent)}
    nav .roles{display:flex;align-items:center;gap:10px;margin-left:auto;padding-left:14px;
      border-left:1px solid var(--line)}
    nav .roles-group{display:flex;gap:2px;background:var(--card);border:1px solid var(--line2);
      border-radius:10px;padding:2px}
    nav a.role{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:600;font-size:13px;
      padding:6px 12px;border-radius:8px}
    nav a.role:hover{color:var(--txt);filter:none}
    nav a.role.active{background:var(--accent);color:#fff}
    nav a.role.active svg{stroke:#fff}
    #theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
      border-radius:9px;background:var(--card);border:1px solid var(--line2);color:var(--mut);
      cursor:pointer;transition:background .15s,color .15s;margin-left:6px}
    #theme-toggle:hover{color:var(--txt);background:var(--card2)}
    #theme-toggle svg{width:17px;height:17px}
    #theme-toggle .i-sun{display:none} #theme-toggle .i-moon{display:inline}
    :root[data-theme="dark"] #theme-toggle .i-sun{display:inline}
    :root[data-theme="dark"] #theme-toggle .i-moon{display:none}

    .wrap{max-width:1160px;margin:0 auto;padding:26px 22px 60px}
    .page-h{display:flex;align-items:baseline;gap:12px;margin:2px 0 6px;flex-wrap:wrap}
    .page-h h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:0}
    .page-h .sub{color:var(--mut);font-size:13.5px}
    .page-audience{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
      letter-spacing:.04em;color:var(--dim);text-transform:uppercase;margin:0 0 22px}
    .page-audience .tag{background:var(--card2);border:1px solid var(--line2);border-radius:6px;
      padding:3px 8px;color:var(--mut)}

    /* ── Карточки ── */
    .card{background:linear-gradient(180deg,var(--card),var(--card2));
      border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;
      margin-bottom:16px;box-shadow:var(--shadow)}
    .card h2,.card h3{margin:0 0 12px;font-size:15px;font-weight:700;letter-spacing:-.01em;
      display:flex;align-items:center;gap:8px}
    .card h2 svg,.card h3 svg{stroke:var(--accent)}

    /* ── KPI-плитки: крупная цифра пропорциональным начертанием (не моно/не tabular — ── */
    /* ── это для колонок таблиц, а не для витринного числа), слева — цветная рейка-статус ── */
    .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
    .kpi{background:linear-gradient(180deg,var(--card),var(--card2));
      border:1px solid var(--line);border-left:3px solid var(--line2);
      border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
    .kpi .l{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12.5px;
      letter-spacing:.01em;margin-bottom:7px}
    .kpi .v{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
    .kpi.money{border-left-color:var(--money)} .kpi.money .v{color:var(--money-text)}
    .kpi.good{border-left-color:var(--good)}   .kpi.good .v{color:var(--good-text)}
    .kpi.bad{border-left-color:var(--bad)}      .kpi.bad .v{color:var(--bad-text)}
    .kpi.accent{border-left-color:var(--accent)}

    /* ── Glassmorphism: матовое стекло для карточек в тёмной теме — читается только ── */
    /* ── поверх текстурированного фона (радиальный градиент на body даёт что размывать) ── */
    :root[data-theme="dark"] .card,
    :root[data-theme="dark"] .player{
      background:rgba(25,25,25,.55);
      -webkit-backdrop-filter:blur(12px);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.06), inset 0 0 32px rgba(255,255,255,.015),
        0 12px 30px -16px rgba(0,0,0,.7);
    }
    :root[data-theme="dark"] .kpi{
      background:rgba(25,25,25,.55);
      -webkit-backdrop-filter:blur(12px);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.08);
      border-left-width:3px;
      border-radius:12px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.06), inset 0 0 32px rgba(255,255,255,.015),
        0 12px 30px -16px rgba(0,0,0,.7);
    }
    :root[data-theme="dark"] .seg{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

    /* ── Таблицы: моноцифры только в колонках (по гайду), ховер строк ── */
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
    thead th{color:var(--mut);font-weight:700;font-size:11.5px;text-transform:uppercase;
      letter-spacing:.05em;border-bottom:1px solid var(--line2)}
    tbody tr{transition:background .12s}
    tbody tr:hover{background:var(--card2)}
    td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}

    /* ── Пилюли-статусы: всегда с текстом, не только цветом (см. dataviz skill) ── */
    .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
      font-size:12px;font-weight:600;border:1px solid transparent}
    .pill svg{width:12px;height:12px}
    .pill.good{background:var(--good-soft);color:var(--good-text);border-color:var(--good);border-color:color-mix(in srgb, var(--good) 35%, transparent)}
    .pill.bad{background:var(--bad-soft);color:var(--bad-text);border-color:color-mix(in srgb, var(--bad) 35%, transparent)}
    .pill.warn{background:var(--warn-soft);color:var(--warn-text);border-color:color-mix(in srgb, var(--warn) 35%, transparent)}
    .pill.muted{background:var(--card2);color:var(--mut);border-color:var(--line2)}

    .mut{color:var(--mut)} .dim{color:var(--dim)}
    .empty-state{color:var(--dim);font-size:13.5px;padding:6px 0}

    /* ── Поля ввода ── */
    input,select{background:var(--bg2);border:1px solid var(--line2);color:var(--txt);
      border-radius:10px;padding:9px 12px;font-size:14px;font-family:var(--sans);outline:none;
      transition:border .15s,box-shadow .15s}
    input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    button,.btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:0;
      border-radius:10px;padding:9px 15px;font-size:14px;font-weight:600;font-family:var(--sans);
      cursor:pointer;transition:filter .15s}
    button:hover,.btn:hover{filter:brightness(1.1)}
    .btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line2)}

    /* ── Транскрипт: реплики с ролями, ред-флаг обводкой ── */
    .seg{padding:10px 13px;border-radius:11px;margin:7px 0;border:1px solid transparent}
    .seg.operator{background:var(--accent-soft)}
    .seg.client{background:var(--card2)}
    .seg.flagged{border-color:var(--bad);background:var(--bad-soft)}
    .seg .who{font-size:11.5px;color:var(--mut);font-weight:700;text-transform:uppercase;
      letter-spacing:.04em;margin-bottom:3px}
    .seg audio,audio{width:100%}

    /* ── Чек-лист ── */
    .check{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
    .check:last-child{border-bottom:0}

    /* ── Аудио-плеер карточка ── */
    .player{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:14px 16px}

    @media (max-width:640px){
      .wrap{padding:18px 14px 48px}
      nav{gap:2px;padding:10px 14px}
      nav a.nl{padding:6px 9px;font-size:13px}
      nav .roles{margin-left:0;padding-left:0;border-left:0;width:100%;justify-content:flex-start;
        margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
      .page-h{flex-direction:column;gap:2px}
    }
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  </style>
</head>
<body>
  <nav>
    <span class="brand"><span class="dot"></span>
      <span>Call Analyzer<small>revenue&nbsp;qa</small></span>
    </span>
    {% set p = request.url.path %}
    <span class="section-label">Отчёты</span>
    <a href="/" class="nl {{ 'active' if p=='/' }}" title="Потери в деньгах, что можно спасти, ред-флаги — полная детализация">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5a2.5 2.5 0 0 1 2.5-2h1a2 2 0 0 1 0 4h-1a2 2 0 0 0 0 4h1a2.5 2.5 0 0 0 2.5-2"/></svg>
      Где деньги
    </a>
    <a href="/conversions" class="nl {{ 'active' if p=='/conversions' }}" title="Тёплые лиды → закрытые сделки, скорость отклика, сверка с CRM">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 4h16l-6 8v6l-4 2v-8L4 4Z"/></svg>
      Конверсии
    </a>
    <a href="/tops" class="nl {{ 'active' if p=='/tops' }}" title="Конкретные звонки для прослушивания: проблемные, эталонные, конфликтные">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 3.5l2.5 5.4 5.8.6-4.4 3.9 1.3 5.7L12 16l-5.2 3.1 1.3-5.7-4.4-3.9 5.8-.6L12 3.5Z"/></svg>
      Топы
    </a>
    <a href="/calls" class="nl {{ 'active' if p=='/calls' or p.startswith('/calls/') }}" title="Список всех звонков с поиском по номеру и фильтрами">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 5c0 8 7 15 15 15l1.5-4-5-2-1.5 2c-2.4-1-4.5-3-5.5-5.5l2-1.5-2-5L4 5Z"/></svg>
      Звонки
    </a>
    <span class="roles">
      <span class="roles-group">
        <a href="/boss" class="role {{ 'active' if p=='/boss' }}" title="Один экран: деньги + точки роста — для руководителя">
          <svg class="ico" viewBox="0 0 24 24"><path d="M3 20V10l4 3 5-7 5 7 4-3v10H3Z"/></svg>
          Руководитель
        </a>
        <a href="/rop" class="role {{ 'active' if p=='/rop' }}" title="Соблюдение скрипта по операторам — для РОП">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></svg>
          РОП
        </a>
      </span>
    </span>
    <a href="/upload" class="btn {{ 'active' if p=='/upload' }}" style="margin-left:10px;padding:8px 14px"
       title="Загрузить отдельный аудиофайл на разбор — в обход телефонии">
      <svg class="ico" viewBox="0 0 24 24" style="stroke:#fff"><path d="M12 16V4m0 0 5 5m-5-5-5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      Загрузить
    </a>
    <button id="theme-toggle" type="button" onclick="
      var r=document.documentElement, n=r.getAttribute('data-theme')==='dark'?'light':'dark';
      r.setAttribute('data-theme', n); localStorage.setItem('theme', n);
    " aria-label="Переключить тему" title="Светлая / тёмная тема">
      <svg class="ico i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
      <svg class="ico i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
    </button>
  </nav>
  <div class="wrap">{% block body %}{% endblock %}</div>
</body>
</html>
