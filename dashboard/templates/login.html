<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Call Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function(){
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    :root{
      --bg:#f9f9f7; --card:#fcfcfb; --card2:#f1f0ea;
      --line:#e5e3db; --line2:rgba(11,11,11,.12);
      --txt:#0b0b0b; --mut:#52514e; --dim:#898781;
      --accent:#5457e5; --accent-soft:rgba(84,87,229,.10);
      --bad:#d03b3b; --bad-text:#b3271f; --bad-soft:rgba(208,59,59,.10);
      --primary-bg:var(--txt); --primary-fg:#fff;
      --radius:10px; --radius-card:22px;
      --shadow:0 25px 80px -12px rgba(11,11,11,.10), 0 0 0 1px rgba(11,11,11,.05);
      --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --display:'Instrument Serif',Georgia,serif;
      color-scheme: light;
    }
    :root[data-theme="dark"]{
      --bg:#16171c; --card:#212328; --card2:#282b32;
      --line:#34373f; --line2:rgba(255,255,255,.14);
      --txt:#f5f5f3; --mut:#c3c2b7; --dim:#8b8d95;
      --accent:#6d70ee; --accent-soft:rgba(109,112,238,.18);
      --bad:#d03b3b; --bad-text:#ea6c6c; --bad-soft:rgba(208,59,59,.18);
      --primary-bg:var(--txt); --primary-fg:#101018;
      --shadow:0 25px 80px -12px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
      color-scheme: dark;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
      background:
        radial-gradient(900px 520px at 15% -10%, var(--accent-soft) 0%, transparent 55%),
        radial-gradient(700px 460px at 100% 100%, var(--accent-soft) 0%, transparent 50%),
        var(--bg);
      color:var(--txt); font:15px/1.55 var(--sans); -webkit-font-smoothing:antialiased}
    #theme-toggle{position:fixed;top:20px;right:20px;display:inline-flex;align-items:center;justify-content:center;
      width:34px;height:34px;border-radius:50%;background:var(--card);border:0;box-shadow:var(--shadow);
      color:var(--mut);cursor:pointer}
    #theme-toggle svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.8;fill:none;
      stroke-linecap:round;stroke-linejoin:round}
    #theme-toggle .i-sun{display:none} #theme-toggle .i-moon{display:inline}
    :root[data-theme="dark"] #theme-toggle .i-sun{display:inline}
    :root[data-theme="dark"] #theme-toggle .i-moon{display:none}
    .card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);
      border-radius:var(--radius-card);padding:36px 32px;box-shadow:var(--shadow)}
    .brand{display:flex;align-items:center;gap:9px;justify-content:center;margin-bottom:22px}
    .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
    .brand span{font-weight:800;letter-spacing:-.01em;color:var(--txt)}
    h1{font-family:var(--display);font-weight:400;font-size:32px;letter-spacing:-.01em;
      text-align:center;margin:0 0 6px}
    .sub{color:var(--mut);font-size:13.5px;text-align:center;margin:0 0 26px}
    label{display:block;margin-bottom:6px;font-size:13px;color:var(--txt)}
    .field{margin-bottom:14px}
    input{width:100%;background:var(--card2);border:1px solid var(--line2);color:var(--txt);
      border-radius:var(--radius);padding:10px 12px;font-size:14px;font-family:var(--sans);outline:none;
      transition:border .15s,box-shadow .15s}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    button{width:100%;margin-top:6px;display:inline-flex;align-items:center;justify-content:center;
      background:var(--primary-bg);color:var(--primary-fg);border:0;border-radius:999px;
      padding:11px 15px;font-size:14px;font-weight:600;font-family:var(--sans);cursor:pointer;
      transition:filter .15s}
    button:hover{filter:brightness(1.1)}
    .error{background:var(--bad-soft);color:var(--bad-text);border:1px solid color-mix(in srgb, var(--bad) 35%, transparent);
      border-radius:var(--radius);padding:9px 12px;font-size:13px;margin-bottom:16px}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  </style>
</head>
<body>
  <button id="theme-toggle" type="button" onclick="
    var r=document.documentElement, n=r.getAttribute('data-theme')==='dark'?'light':'dark';
    r.setAttribute('data-theme', n); localStorage.setItem('theme', n);
  " aria-label="Переключить тему" title="Светлая / тёмная тема">
    <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
  </button>
  <div class="card">
    <div class="brand"><span class="dot"></span><span>Call Analyzer</span></div>
    <h1>Вход</h1>
    <p class="sub">Revenue QA — доступ по логину и паролю</p>
    {% if error %}<div class="error">Неверный логин или пароль.</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="username">Логин</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Войти</button>
    </form>
  </div>
</body>
</html>
